apiVersion: v1
kind: Pod
metadata:
  name: homepage-pod
  labels:
    app: homepage
    io.containers.autoupdate: "image"
spec:
  automountServiceAccountToken: false
  containers:
  - name: homepage
    image: ghcr.io/gethomepage/homepage:latest
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    ports:
    - name: http
      containerPort: 3000
    env:
    - name: HOMEPAGE_ALLOWED_HOSTS
      value: "home.simonemiglio.eu"
    - name: HOST
      value: "0.0.0.0"
    - name: HOSTNAME
      value: "0.0.0.0"
    - name: PORT
      value: "3000"
    - name: HOMEPAGE_VAR_IMMICH_API_KEY
      valueFrom:
        secretKeyRef:
          name: homepage-immich-key-k8s
          key: apikey
    # Next.js binds to the pod's IP, not 127.0.0.1, so the image's baked-in
    # HEALTHCHECK (targeting loopback) always fails. Override with a probe
    # that goes through services_net DNS to the pod's actual interface.
    livenessProbe:
      exec:
        command:
          - sh
          - -c
          - "wget -q --spider --timeout=3 http://homepage-pod:3000/ || exit 1"
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    volumeMounts:
    - name: nextjs-cache
      mountPath: /app/.next/cache
    - name: tmp
      mountPath: /tmp
    - name: homepage-config-volume
      mountPath: /app/config
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
        ephemeral-storage: "1Gi"
      limits:
        memory: "256Mi"
        ephemeral-storage: "2Gi"
  volumes:
  - name: nextjs-cache
    emptyDir: {}
  - name: tmp
    emptyDir: {}
  - name: homepage-config-volume
    hostPath:
      path: /home/osvaldo/podman/data/homepage/config
      type: DirectoryOrCreate
