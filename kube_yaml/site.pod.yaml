apiVersion: v1
kind: Pod
metadata:
  name: main-pod # This name is used by global-caddy
  labels:
    app: main
    io.containers.autoupdate: "local" # local image (built via build_site); 'registry'/'image' fails auto-update on localhost/*
spec:
  automountServiceAccountToken: false
  containers:
  - name: backend
    image: localhost/main-backend:1.0.0 # Ensure this image is available
    securityContext:
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    ports:
    - name: backend-http
      containerPort: 3000
    env:
    - name: NODE_ENV
      value: "production"
    - name: CORS_ORIGIN
      value: "https://simonemiglio.eu" # This is correct for the public-facing URL
    volumeMounts:
    - name: backend-tmp
      mountPath: /tmp
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        memory: "128Mi"

  - name: main-caddy # Kept 'caddy' in your original, you can rename for clarity if you wish
    image: docker.io/library/caddy:2-alpine
    # Binds only the high port 8080 internally -> no NET_BIND_SERVICE needed.
    securityContext:
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    ports:
    - name: internal-http # Port exposed by this Caddy to the pod/services_net network
      containerPort: 8080 # << Use this port for internal Caddy
    volumeMounts:
    - name: sitecaddy-data
      mountPath: /data
    - name: sitecaddy-cfgstate
      mountPath: /config
    - name: sitecaddy-tmp
      mountPath: /tmp
    - name: frontend-dist
      mountPath: /usr/share/caddy
    - name: caddy-config
      mountPath: /etc/caddy
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        memory: "128Mi"

  volumes:
  - name: backend-tmp
    emptyDir: {}
  - name: sitecaddy-data
    emptyDir: {}
  - name: sitecaddy-cfgstate
    emptyDir: {}
  - name: sitecaddy-tmp
    emptyDir: {}
  - name: frontend-dist
    hostPath:
      path: /home/osvaldo/podman/data/site/frontend_dist # Absolute path
      type: DirectoryOrCreate
  - name: caddy-config
    hostPath:
      path: /home/osvaldo/podman/data/site/caddy_config # Absolute path
      type: DirectoryOrCreate
