apiVersion: v1
kind: Pod
metadata:
  name: firefly-importer-pod
  labels:
    app: firefly-importer
spec:
  automountServiceAccountToken: false
  # Run as root (in-container uid 0 -> host uid 1000) so the serversideup
  # entrypoint can write /etc/nginx/nginx.conf at startup (image ships it
  # root-owned; the image-default www-data user can't -> EACCES crash-loop).
  # Workers are dropped to www-data internally by the entrypoint.
  securityContext:
    runAsUser: 0
    runAsGroup: 0

  # Init container - solo crea struttura
  initContainers:
  - name: init-storage
    image: docker.io/fireflyiii/data-importer:latest
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    command:
      - sh
      - -c
      - |
        # Crea solo le directory necessarie (senza chown/chmod)
        mkdir -p /var/www/html/storage/app/public
        mkdir -p /var/www/html/storage/framework/cache/data
        mkdir -p /var/www/html/storage/framework/sessions
        mkdir -p /var/www/html/storage/framework/views
        mkdir -p /var/www/html/storage/logs
        mkdir -p /var/www/html/storage/uploads
        mkdir -p /var/www/html/storage/configurations
        mkdir -p /var/www/html/storage/conversion-routines
        mkdir -p /var/www/html/storage/submission-routines
        mkdir -p /var/www/html/storage/jobs
    volumeMounts:
    - name: importer-storage
      mountPath: /var/www/html/storage
  
  containers:
  - name: firefly-importer
    image: docker.io/fireflyiii/data-importer:latest
    # serversideup s6 entrypoint runs as root (pod runAsUser:0) and drops
    # workers to www-data -> needs CHOWN/DAC_OVERRIDE/FOWNER/SETGID/SETUID.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
        add:
        - CHOWN
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
    ports:
    - name: importer-http
      containerPort: 8080
    env:
    - name: FIREFLY_III_URL
      value: "http://firefly-pod:8080"
    - name: VANITY_URL
      value: "https://finanza.simonemiglio.eu"
    - name: VERIFY_TLS_SECURITY
      value: "false"
    - name: TZ
      value: "Europe/Rome"
    # Trust only the services_net subnet, not "**" (which would allow IP spoofing).
    - name: TRUSTED_PROXIES
      value: "10.89.0.0/24"
    - name: EXPECT_SECURE_URL
      value: "false"
    - name: LOG_LEVEL
      value: "notice"
    volumeMounts:
    - name: php-fpm-conf
      mountPath: /usr/local/etc/php-fpm.d/www.conf
    - name: importer-storage
      mountPath: /var/www/html/storage
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        memory: "256Mi"
    livenessProbe:
      exec:
        command:
          - sh
          - -c
          - "curl -fsS -o /dev/null http://127.0.0.1:8080/ || exit 1"
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
  
  volumes:
  - name: php-fpm-conf
    hostPath:
      path: /home/osvaldo/podman/data/firefly-importer/www.conf
      type: File
  - name: importer-storage
    hostPath:
      path: /home/osvaldo/podman/data/firefly-importer/storage
      type: DirectoryOrCreate
