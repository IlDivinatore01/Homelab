apiVersion: v1
kind: Pod
metadata:
  name: fastfood-pod
  labels:
    app: fastfood
    io.containers.autoupdate: "local" # local image (built via build_fastfood); 'registry'/'image' fails auto-update on localhost/*
spec:
  automountServiceAccountToken: false
  restartPolicy: Always
  volumes:
  - name: tmp
    emptyDir: {}
  - name: uploaded-images
    hostPath:
      path: /home/osvaldo/podman/data/fastfood/uploads
      type: DirectoryOrCreate
  containers:
  # Single Container: Node.js Backend (serves both API and static files)
  # Simplified from 2-container architecture (removed Caddy sidecar)
  - name: backend
    image: localhost/fastfood-backend:1.0.0
    securityContext:
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    ports:
    - name: http
      containerPort: 3000
      hostPort: 5000  # Keep external port 5000 for compatibility
    env:
    - name: NODE_ENV
      value: "production"
    - name: PORT
      value: "3000"
    - name: MONGO_URI
      valueFrom:
        secretKeyRef:
          name: fastfood-mongo-uri
          key: uri
    - name: JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: fastfood-jwt-secret
          key: secret
    - name: ALLOWED_ORIGINS
      value: "https://fastfood.simonemiglio.eu"
    volumeMounts:
    - name: tmp
      mountPath: /tmp
    - name: uploaded-images
      mountPath: /app/frontend/public/images/uploads
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        memory: "512Mi"
