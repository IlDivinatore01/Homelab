apiVersion: v1
kind: Pod
metadata:
  name: uptime-kuma-pod
spec:
  containers:
  - name: uptime-kuma
    # Pinned to the current beta version we have data for.
    # Floating ':beta' auto-pulls new (potentially breaking) betas. Bump manually.
    image: docker.io/louislam/uptime-kuma:2.1.0-beta.3
    ports:
    - containerPort: 3001
      hostPort: 3001
    volumeMounts:
    - name: uptime-kuma-data
      mountPath: /app/data
    resources:
      limits:
        memory: 512Mi
        cpu: 200m
      requests:
        memory: 128Mi
        cpu: 50m
  volumes:
  - name: uptime-kuma-data
    hostPath:
      path: /home/osvaldo/podman/data/uptime-kuma
      type: DirectoryOrCreate
  restartPolicy: Always
