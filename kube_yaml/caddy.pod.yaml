apiVersion: v1
kind: Pod
metadata:
  name: caddy-pod
  labels:
    app: caddy
    # Podman auto-update — 'registry' is the documented value (Podman silently
    # normalized the older 'image' to registry, but be explicit).
    io.containers.autoupdate: "registry"
spec:
  automountServiceAccountToken: false
  containers:
  - name: caddy
    # Pinned to a specific minor version. Bump manually after testing on a new release.
    image: docker.io/library/caddy:2.11
    # Hardening: no privilege escalation + drop all caps except the one Caddy
    # needs to bind low ports 80/443 (process starts as root, so the cap in
    # the effective set is honored despite allowPrivilegeEscalation:false).
    securityContext:
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
        add:
        - NET_BIND_SERVICE
    ports:
    - name: http
      containerPort: 80
      hostPort: 80         # Expose on host
    - name: https
      containerPort: 443
      hostPort: 443        # Expose on host
    - name: https-udp      # For HTTP/3
      containerPort: 443
      protocol: UDP
      hostPort: 443        # Expose on host
    volumeMounts:
    - name: tmp
      mountPath: /tmp
    - name: caddyfile
      mountPath: /etc/caddy/Caddyfile
      # subPath: Caddyfile     # Mounts only the Caddyfile file
      readOnly: true
    - name: caddy-data-volume
      mountPath: /data       # For ACME certs etc.
    - name: caddy-config-volume # For other Caddy configs/state
      mountPath: /config
    - name: caddy-log-volume   # Access logs read by fail2ban on the host
      mountPath: /var/log/caddy
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
        ephemeral-storage: "1Gi"
      limits:
        memory: "512Mi"
        ephemeral-storage: "2Gi"
  volumes:
  - name: tmp
    emptyDir: {}
  - name: caddyfile
    hostPath:
      path: /home/osvaldo/podman/data/caddy/Caddyfile # Dir containing Caddyfile
      type: File
  - name: caddy-data-volume
    hostPath:
      path: /home/osvaldo/podman/data/caddy/acme_certs_data
      type: DirectoryOrCreate
  - name: caddy-config-volume
    hostPath:
      path: /home/osvaldo/podman/data/caddy/config_data
      type: DirectoryOrCreate
  - name: caddy-log-volume
    hostPath:
      path: /home/osvaldo/podman/data/caddy/log
      type: DirectoryOrCreate
