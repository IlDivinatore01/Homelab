apiVersion: v1
kind: Pod
metadata:
  name: it-tools-pod
  labels:
    app: it-tools
    io.containers.autoupdate: registry
spec:
  containers:
    - name: it-tools
      image: docker.io/corentinth/it-tools:latest
      # nginx serves on :80 internally: master starts as root (bind 80 + spawn
      # workers as nginx user), so it needs the classic nginx cap set.
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
          add:
          - CHOWN
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
          - NET_BIND_SERVICE
      resources:
        limits:
          memory: 256Mi
          cpu: 500m
