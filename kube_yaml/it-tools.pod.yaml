apiVersion: v1
kind: Pod
metadata:
  name: it-tools-pod
  labels:
    app: it-tools
    io.containers.autoupdate: registry
spec:
  containers:
    - name: it-tools
      image: docker.io/corentinth/it-tools:latest
      # nginx serves on :80 internally: master starts as root (bind 80 + spawn
      # workers as nginx user), so it needs the classic nginx cap set.
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        readOnlyRootFilesystem: true
        capabilities:
          drop:
          - ALL
          add:
          - CHOWN
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
          - NET_BIND_SERVICE
      volumeMounts:
      - name: nginx-cache
        mountPath: /var/cache/nginx
      - name: nginx-run
        mountPath: /run
      - name: tmp
        mountPath: /tmp
      resources:
        limits:
          memory: 256Mi
          cpu: 500m
  volumes:
  - name: nginx-cache
    emptyDir: {}
  - name: nginx-run
    emptyDir: {}
  - name: tmp
    emptyDir: {}
