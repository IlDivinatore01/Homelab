# ~/podman/kube_yaml/firefly.pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: firefly-pod
  labels:
    app: firefly
    io.containers.autoupdate: "registry"
spec:
  automountServiceAccountToken: false
  
  containers:
  # =======================================================
  # CONTAINER 1: MARIA DB
  # =======================================================
  - name: firefly-db
    image: docker.io/library/mariadb:lts
    # MariaDB entrypoint starts as root, chowns the datadir then drops to the
    # 'mysql' user via gosu -> needs CHOWN/DAC_OVERRIDE/FOWNER/SETGID/SETUID.
    securityContext:
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
        - ALL
        add:
        - CHOWN
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
    ports:
    # Internal port only - reachable via pod DNS (firefly-pod:3306) on services_net.
    # No hostPort: keeps MariaDB unreachable from outside the pod/network.
    - name: mysql
      containerPort: 3306
    env:
    - name: MYSQL_RANDOM_ROOT_PASSWORD
      value: "yes"
    - name: MYSQL_USER
      valueFrom:
        secretKeyRef:
          name: firefly-db-user-k8s
          key: username
    - name: MYSQL_PASSWORD
      valueFrom:
        secretKeyRef:
          name: firefly-db-password-k8s
          key: password
    - name: MYSQL_DATABASE
      valueFrom:
        secretKeyRef:
          name: firefly-db-name-k8s
          key: dbname
    volumeMounts:
    - name: firefly-db-data
      mountPath: /var/lib/mysql
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        memory: "512Mi"

  # =======================================================
  # CONTAINER 2: FIREFLY APP (Entrypoint originale)
  # =======================================================
  - name: firefly-app
    image: docker.io/fireflyiii/core:latest
    # Run the serversideup entrypoint as root (in-container uid 0 → host uid
    # 1000) so it can write /etc/nginx/nginx.conf at startup, then it drops
    # workers to www-data internally. Required because the image ships
    # /etc/nginx owned by root: running directly as www-data (the image's
    # default User) can't write it -> EACCES crash-loop.
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
        - ALL
        add:
        - CHOWN
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
    ports:
    - name: http
      containerPort: 8080
    env:
    - name: APP_ENV
      value: "production"
    - name: APP_DEBUG
      value: "false"
    - name: SITE_OWNER
      value: "simone.miglio@proton.me"
    - name: APP_KEY
      valueFrom:
        secretKeyRef:
          name: firefly-app-key-k8s
          key: appkey
    - name: DEFAULT_LANGUAGE
      value: "it_IT"
    - name: DEFAULT_LOCALE
      value: "equal"
    - name: TZ
      value: "Europe/Rome"
    # Trust only the sensitive_net subnet — Caddy is multi-homed and reaches
    # firefly from its sensitive_net IP, not services_net. "**" would let any
    # client spoof X-Forwarded-For.
    - name: TRUSTED_PROXIES
      value: "10.89.2.0/24"
    - name: LOG_CHANNEL
      value: "stack"
    - name: APP_LOG_LEVEL
      value: "notice"
    - name: AUDIT_LOG_LEVEL
      value: "emergency"
    - name: DB_CONNECTION
      value: "mysql"
    - name: DB_HOST
      value: "127.0.0.1"
    - name: DB_PORT
      value: "3306"
    - name: DB_DATABASE
      valueFrom:
        secretKeyRef:
          name: firefly-db-name-k8s
          key: dbname
    - name: DB_USERNAME
      valueFrom:
        secretKeyRef:
          name: firefly-db-user-k8s
          key: username
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: firefly-db-password-k8s
          key: password
    - name: CACHE_DRIVER
      value: "file"
    - name: SESSION_DRIVER
      value: "file"
    - name: COOKIE_PATH
      value: "/"
    - name: COOKIE_SECURE
      value: "true"
    - name: COOKIE_SAMESITE
      value: "lax"
    - name: MAIL_MAILER
      value: "log"
    - name: APP_URL
      value: "https://finanza.simonemiglio.eu"
    - name: STATIC_CRON_TOKEN
      valueFrom:
        secretKeyRef:
          name: firefly-cron-token-k8s
          key: crontoken
    volumeMounts:
    - name: firefly-storage-data
      mountPath: /var/www/html/storage
    - name: firefly-bootstrap-cache
      mountPath: /var/www/html/bootstrap/cache
    - name: nginx-log
      mountPath: /var/log/nginx
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        memory: "1Gi"
    livenessProbe:
      exec:
        command:
          - sh
          - -c
          - "curl -fsS http://127.0.0.1:8080/health || exit 1"
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3

  # =======================================================
  # CONTAINER 3: FIREFLY CRON
  # =======================================================
  - name: firefly-cron
    image: docker.io/library/alpine:latest
    securityContext:
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
        - ALL
    env:
    - name: TZ
      value: "Europe/Rome"
    - name: STATIC_CRON_TOKEN
      valueFrom:
        secretKeyRef:
          name: firefly-cron-token-k8s
          key: crontoken
    command:
    - sh
    - -c
    - |
      apk add tzdata wget && \
      (ln -fs /usr/share/zoneinfo/$TZ /etc/localtime || true) && \
      echo "0 3 * * * wget -qO- http://127.0.0.1:8080/api/v1/cron/$STATIC_CRON_TOKEN;echo" | crontab - && \
      crond -f -L /dev/stdout
    resources:
      requests:
        cpu: "50m"
        memory: "32Mi"
      limits:
        memory: "64Mi"

  # =======================================================
  # VOLUMI
  # =======================================================
  volumes:
  - name: firefly-db-data
    hostPath:
      path: /home/osvaldo/podman/data/firefly/db
      type: DirectoryOrCreate
  - name: firefly-storage-data
    hostPath:
      path: /home/osvaldo/podman/data/firefly/storage
      type: DirectoryOrCreate
  - name: firefly-bootstrap-cache
    hostPath:
      path: /home/osvaldo/podman/data/firefly/bootstrap-cache
      type: DirectoryOrCreate
  - name: nginx-log
    emptyDir: {}
